<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyorkSlydes Editor</title>
    <style>
        :root {
            --toolbar-bg: #f8f9fa;
            --toolbar-border: #dee2e6;
            --button-hover: #e9ecef;
        }

        body {
            margin: 0;
            font-family: 'Aptos', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            padding: 10px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--toolbar-border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar button,
        .toolbar select,
        .toolbar input {
            padding: 6px 12px;
            border: 1px solid #ced4da;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            min-width: 80px;
        }

        .toolbar button:hover {
            background: var(--button-hover);
        }

        #slides-container {
            display: flex;
            flex: 1;
            overflow: auto;
            align-items: center;
            justify-content: center;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px;
            border: none;
            resize: none;
            font-size: 12pt;
            line-height: 1.5;
            outline: none;
            background: white;
            margin: 0;
            box-sizing: border-box;
            overflow-y: auto; /* İçerik taşarsa dikey kaydırma çubuğu ekler */
        }

        .slide.active {
            display: block;
        }

        .myork-code {
            display:block;
            margin:12px 0;
            padding:14px;
            border-radius:8px;
            background:#111827;
            color:#e5e7eb;
            font:13px/1.5 Consolas, "Cascadia Code", monospace;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
        }
        .myork-code::before {
            content:attr(data-language);
            display:block;
            color:#a5b4fc;
            font-size:10px;
            text-transform:uppercase;
            margin-bottom:8px;
        }
        .slide table { border-collapse:collapse; max-width:100%; }
        .slide td,.slide th { border:1px solid #9ca3af; padding:6px; min-width:45px; }

        .status-bar {
            padding: 8px;
            background: var(--toolbar-bg);
            border-top: 1px solid var(--toolbar-border);
            display: flex;
            justify-content: space-between;
        }

        .lang-switcher {
            position: fixed;
            top: 10px;
            right: 10px;
        }

        .slide-panel {
            width: 200px;
            background: var(--toolbar-bg);
            border-right: 1px solid var(--toolbar-border);
            padding: 10px;
            overflow-y: auto;
            height: 100%;
        }

        .slide-thumbnail {
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            background: white;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slide-thumbnail.active {
            border-color: #007bff;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .slide-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>
    <div class="lang-switcher">
        <select id="language" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="slide-panel" id="slide-panel">
        <div class="slide-thumbnail active" onclick="selectSlide(0)">Slayt 1</div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button data-lang-key="newSlide" onclick="newSlide()">Yeni Slayt</button>
            <button data-lang-key="deleteSlide" onclick="deleteSlide()">Slaytı Sil</button>
            <button data-lang-key="save" onclick="saveSlides()">Kaydet</button>
            <button onclick="loadSlides()">Open / Aç</button>
            <button onclick="insertCodeBlock()">Code / Kod</button>
            <button onclick="runCodeSnippet()">Run HTML/JS</button>
            <select id="codeLanguage" aria-label="Code language">
                <option value="html">HTML</option><option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option><option value="python">Python</option>
                <option value="css">CSS</option><option value="java">Java</option>
                <option value="dart">Dart</option><option value="jsx">React / JSX</option>
                <option value="tsx">React / TSX</option><option value="json">JSON</option>
                <option value="sql">SQL</option><option value="cpp">C++</option>
                <option value="csharp">C#</option><option value="go">Go</option>
                <option value="rust">Rust</option><option value="kotlin">Kotlin</option>
                <option value="swift">Swift</option>
            </select>
            <button onclick="exportSlidesHTML()">Export HTML</button>
            <button onclick="exportSlidesPDF()">Export PDF</button>
            <button onclick="exportSlidesImage('png')">PNG</button>
            <button onclick="exportSlidesImage('jpeg')">JPEG</button>
            <button onclick="exportSlidesPPTX()">PPTX</button>
            <button onclick="prevSlide()">Önceki Slayt</button>
            <button onclick="nextSlide()">Sonraki Slayt</button>
            <button onclick="startPresentation()">Sunumu Başlat</button>

            <select id="fontFamily" data-lang-key="font" onchange="changeFontFamily(this.value)">
                <option value="Aptos">Aptos</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
            </select>

            <select id="fontSize" data-lang-key="size" onchange="changeFontSize(this.value)">
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16" selected>16</option>
            </select>

            <button data-lang-key="bold" onclick="formatText('bold')"><b>K</b></button>
            <button data-lang-key="italic" onclick="formatText('italic')"><i>İ</i></button>
            <button data-lang-key="underline" onclick="formatText('underline')"><u>A</u></button>

            <button onclick="alignText('left')">Sol</button>
            <button onclick="alignText('center')">Ortala</button>
            <button onclick="alignText('right')">Sağ</button>
            <button onclick="alignText('justify')">İki Yana Yasla</button>

            <input type="color" id="textColorInput" onchange="changeTextColor(this.value)">
            <input type="color" id="backgroundColorInput" onchange="changeBackgroundColor(this.value)">

            <button onclick="insertImage()">Resim Ekle</button>
            <button onclick="insertShape()">Şekil Ekle</button>
            <button onclick="insertChart()">Grafik Ekle</button>
            <button onclick="insertTable()">Tablo Ekle</button>
        </div>

        <div class="slide-container">
            <div id="slides-container">
                <div class="slide active" contenteditable="true"></div>
            </div>
        </div>

        <div class="status-bar">
            <span data-lang-key="slides">Slaytlar: <span id="slideCount">1</span></span>
            <span data-lang-key="currentSlide">Mevcut Slayt: <span id="currentSlide">1</span></span>
        </div>
    </div>

    <script>
        const translations = {
            tr: {
                newSlide: "Yeni Slayt",
                deleteSlide: "Slaytı Sil",
                save: "Kaydet",
                font: "Yazı Tipi",
                size: "Boyut",
                bold: "Kalın",
                italic: "İtalik",
                underline: "Altı Çizili",
                slides: "Slaytlar",
                currentSlide: "Mevcut Slayt",
                saveSuccess: "Başarıyla kaydedildi!",
                fileError: "Dosya hatası!"
            },
            en: {
                newSlide: "New Slide",
                deleteSlide: "Delete Slide",
                save: "Save",
                font: "Font",
                size: "Size",
                bold: "Bold",
                italic: "Italic",
                underline: "Underline",
                slides: "Slides",
                currentSlide: "Current Slide",
                saveSuccess: "Saved successfully!",
                fileError: "File error!"
            }
        };

        let currentLang = navigator.language.startsWith('tr') ? 'tr' : 'en';
        const SLIDES_AUTOSAVE_KEY = 'myorkslydes_autosave_v2';
        let autosaveTimer = null;
        let presentationTimer = null;
        let slides = [''];
        let currentSlideIndex = 0;

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (el.tagName === 'SELECT') return;
                if (translations[lang][key] !== undefined) {
                    el.textContent = translations[lang][key];
                }
            });
            document.getElementById('language').value = lang;
        }

        const slidesContainer = document.getElementById('slides-container');
        const slidePanel = document.getElementById('slide-panel');
        const slideCountSpan = document.getElementById('slideCount');
        const currentSlideSpan = document.getElementById('currentSlide');

        function newSlide() {
            slides.push('');
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.contentEditable = 'true';
            slidesContainer.appendChild(slide);
            currentSlideIndex = slides.length - 1;
            updateSlides();
            updateStatusBar();
            updateSlidePanel();
        }

        function deleteSlide() {
            if (slides.length > 1) {
                slides.splice(currentSlideIndex, 1);
                slidesContainer.removeChild(slidesContainer.childNodes[currentSlideIndex]);
                currentSlideIndex = Math.max(0, currentSlideIndex - 1);
                updateSlides();
                updateStatusBar();
                updateSlidePanel();
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function saveSlides() {
            syncAllSlides();
            const payload = {
                format: 'myorkslydes',
                version: 2,
                lang: currentLang,
                slides,
                savedAt: new Date().toISOString()
            };
            try { localStorage.setItem(SLIDES_AUTOSAVE_KEY, JSON.stringify(payload)); } catch (error) {}
            downloadBlob(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}), 'presentation.myorksldy');
        }

        function syncAllSlides() {
            const elements = [...slidesContainer.querySelectorAll('.slide')];
            slides = elements.map(el => el.innerHTML);
            if (!slides.length) slides = [''];
        }

        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => {
                try {
                    syncAllSlides();
                    localStorage.setItem(SLIDES_AUTOSAVE_KEY, JSON.stringify({
                        format:'myorkslydes', version:2, lang:currentLang, slides,
                        savedAt:new Date().toISOString()
                    }));
                } catch (error) {}
            }, 400);
        }

        function loadSlides() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.myorksldy,.json,application/json';
            input.onchange = event => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const incoming = Array.isArray(parsed) ? parsed : parsed.slides;
                        if (!Array.isArray(incoming) || !incoming.every(item => typeof item === 'string')) {
                            throw new Error('Unsupported presentation format');
                        }
                        slides = incoming.length ? incoming : [''];
                        currentSlideIndex = 0;
                        renderSlides();
                        if (parsed.lang && translations[parsed.lang]) changeLanguage(parsed.lang);
                        scheduleAutosave();
                    } catch (error) {
                        alert(translations[currentLang].fileError);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function renderSlides() {
            slidesContainer.innerHTML = '';
            slides.forEach((content, index) => {
                const el = document.createElement('div');
                el.className = 'slide' + (index === currentSlideIndex ? ' active' : '');
                el.contentEditable = 'true';
                el.innerHTML = content;
                slidesContainer.appendChild(el);
            });
            updateStatusBar();
            updateSlidePanel();
        }

        function recoverDraft() {
            try {
                const raw = localStorage.getItem(SLIDES_AUTOSAVE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.slides) || !parsed.slides.every(x => typeof x === 'string')) return;
                slides = parsed.slides.length ? parsed.slides : [''];
                currentSlideIndex = 0;
                renderSlides();
                if (parsed.lang && translations[parsed.lang]) changeLanguage(parsed.lang);
            } catch (error) {}
        }

        function updateSlides() {
            const slideElements = document.querySelectorAll('.slide');
            slideElements.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlideIndex) {
                    slide.classList.add('active');
                }
            });
            if (slideElements[currentSlideIndex]) {
                slides[currentSlideIndex] = slideElements[currentSlideIndex].innerHTML;
            }
        }

        function updateStatusBar() {
            slideCountSpan.textContent = slides.length;
            currentSlideSpan.textContent = currentSlideIndex + 1;
        }

        function updateSlidePanel() {
            slidePanel.innerHTML = '';
            slides.forEach((slide, index) => {
                const slideThumbnail = document.createElement('div');
                slideThumbnail.className = 'slide-thumbnail';
                if (index === currentSlideIndex) {
                    slideThumbnail.classList.add('active');
                }
                slideThumbnail.textContent = `Slayt ${index + 1}`;
                slideThumbnail.onclick = () => selectSlide(index);
                slidePanel.appendChild(slideThumbnail);
            });
        }

        function selectSlide(index) {
            currentSlideIndex = index;
            updateSlides();
            updateStatusBar();
            updateSlidePanel();
        }

        document.addEventListener('DOMContentLoaded', () => {
            changeLanguage(currentLang);
            recoverDraft();
            updateStatusBar();
            updateSlidePanel();
            if (slides.length > 0) updateSlides();
        });

        slidesContainer.addEventListener('input', () => {
            syncAllSlides();
            scheduleAutosave();
        });

        function changeFontFamily(font) {
            document.execCommand('fontName', false, font);
        }

        function changeFontSize(size) {
            document.execCommand('fontSize', false, size);
        }

        function formatText(command) {
            document.execCommand(command, false, null);
        }

        function alignText(alignment) {
            document.execCommand('justify' + alignment.charAt(0).toUpperCase() + alignment.slice(1), false, null);
        }

        function changeTextColor(color) {
            document.execCommand('foreColor', false, color);
        }

        function changeBackgroundColor(color) {
            document.execCommand('hiliteColor', false, color);
        }

        function insertImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = event => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = file.name;
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    document.querySelector('.slide.active').appendChild(img);
                    syncAllSlides();
                    scheduleAutosave();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }


        function runCodeSnippet() {
            const language = document.getElementById('codeLanguage').value;
            if (!['html', 'javascript'].includes(language)) {
                alert('Browser preview supports HTML and JavaScript. Other languages remain editable code.');
                return;
            }
            const code = prompt('Paste HTML or JavaScript to run in a sandboxed preview:', '');
            if (code === null) return;
            const preview = window.open('', '_blank');
            if (!preview) { alert('Please allow pop-ups to open the preview.'); return; }
            preview.document.open();
            preview.document.write('<!doctype html><html><head><meta charset="utf-8"><title>MyorkSlydes Code Preview</title></head><body><h2>MyorkSlydes Preview</h2></body></html>');
            preview.document.close();
            const frame = preview.document.createElement('iframe');
            frame.setAttribute('sandbox', 'allow-scripts');
            frame.style.cssText = 'width:100%;height:80vh;border:1px solid #ccc';
            preview.document.body.appendChild(frame);
            const source = language === 'javascript'
                ? '<!doctype html><html><body><div id="app"></div><script>' + code.replace(/<\/script/gi, '<\\/script') + '<' + '/script></body></html>'
                : code;
            frame.srcdoc = source;
        }

        function insertCodeBlock() {
            const language = document.getElementById('codeLanguage').value;
            const code = prompt('Enter code / Kodu girin:', '');
            if (code === null) return;
            const pre = document.createElement('pre');
            pre.className = 'myork-code';
            pre.dataset.language = language;
            pre.contentEditable = 'true';
            const codeElement = document.createElement('code');
            codeElement.textContent = code;
            pre.appendChild(codeElement);
            const slide = document.querySelector('.slide.active');
            if (slide) {
                slide.appendChild(pre);
                syncAllSlides();
                scheduleAutosave();
            }
        }

        function insertShape() {
            const type = prompt("Shape type: rectangle, circle, line", "rectangle");
            if (!type) return;

            const slide = document.querySelector('.slide.active');
            if (!slide) return;

            const shape = document.createElement('div');
            shape.style.display = 'inline-block';
            shape.style.margin = '12px';
            shape.style.verticalAlign = 'middle';
            shape.style.background = '#4f46e5';
            shape.style.border = '2px solid #312e81';
            shape.style.width = '180px';
            shape.style.height = '100px';

            if (type.toLowerCase() === 'circle') {
                shape.style.borderRadius = '50%';
            } else if (type.toLowerCase() === 'line') {
                shape.style.height = '4px';
                shape.style.width = '240px';
                shape.style.border = '0';
                shape.style.background = '#111827';
            } else {
                shape.style.borderRadius = '10px';
            }

            shape.contentEditable = 'false';
            slide.appendChild(shape);
        }

        function insertChart() {
            const slide = document.querySelector('.slide.active');
            if (!slide) return;

            const labels = ["Q1", "Q2", "Q3", "Q4"];
            const values = labels.map(label => {
                const value = prompt("Value for " + label + ":", "10");
                return Number.isFinite(Number(value)) ? Number(value) : 0;
            });

            const chart = document.createElement('div');
            chart.style.display = 'flex';
            chart.style.alignItems = 'end';
            chart.style.gap = '12px';
            chart.style.height = '220px';
            chart.style.padding = '20px';
            chart.style.margin = '16px 0';
            chart.style.background = '#f8fafc';
            chart.style.border = '1px solid #cbd5e1';
            chart.style.borderRadius = '12px';

            const max = Math.max(...values, 1);
            values.forEach((value, index) => {
                const column = document.createElement('div');
                column.style.width = '52px';
                column.style.height = Math.max(10, Math.round((value / max) * 150)) + 'px';
                column.style.background = '#4f46e5';
                column.style.borderRadius = '8px 8px 0 0';
                column.title = labels[index] + ": " + value;

                const label = document.createElement('span');
                label.textContent = labels[index];
                label.style.display = 'block';
                label.style.marginTop = '156px';
                label.style.fontSize = '12px';
                label.style.textAlign = 'center';

                column.appendChild(label);
                chart.appendChild(column);
            });

            slide.appendChild(chart);
        }

        function insertTable() {
            const rows = prompt("Enter number of rows:");
            const cols = prompt("Enter number of columns:");
            if (rows && cols) {
                let tableHTML = "<table>";
                for (let i = 0; i < rows; i++) {
                    tableHTML += "<tr>";
                    for (let j = 0; j < cols; j++) {
                        tableHTML += "<td></td>";
                    }
                    tableHTML += "</tr>";
                }
                tableHTML += "</table>";
                document.querySelector('.slide.active').innerHTML += tableHTML;
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateSlides();
                updateStatusBar();
                updateSlidePanel();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                updateSlides();
                updateStatusBar();
                updateSlidePanel();
            }
        }

        function startPresentation() {
            syncAllSlides();
            const deck = window.open('', '_blank');
            if (!deck) { alert('Please allow pop-ups to present.'); return; }
            const pages = slides.map((html, index) =>
                '<section class="page' + (index === 0 ? ' active' : '') + '">' + html + '</section>'
            ).join('');
            deck.document.write('<!doctype html><html><head><meta charset="utf-8"><title>MyorkSlydes Presentation</title><style>body{margin:0;background:#111;color:#111;font-family:Arial}.page{display:none;box-sizing:border-box;width:100vw;height:100vh;padding:5vw;background:white;overflow:auto;font-size:24px}.page.active{display:block}img{max-width:100%;height:auto}.myork-code{background:#111827;color:#e5e7eb;padding:14px;white-space:pre-wrap}</style></head><body>' + pages + '<script>let i=0;const p=[...document.querySelectorAll(".page")];function show(n){p.forEach((e,j)=>e.classList.toggle("active",j===n));i=n}document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){show(Math.min(i+1,p.length-1))}if(e.key==="ArrowLeft"){show(Math.max(i-1,0))}if(e.key==="Escape")window.close()});</' + 'script></body></html>');
            deck.document.close();
        }

        function exportSlidesHTML() {
            syncAllSlides();
            const pages = slides.map((html, index) => '<section class="slide"><h2>Slide ' + (index + 1) + '</h2>' + html + '</section>').join('');
            const output = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyorkSlydes export</title><style>body{font-family:Arial;margin:0;background:#eee}.slide{box-sizing:border-box;width:960px;min-height:540px;margin:30px auto;padding:40px;background:white;page-break-after:always}img{max-width:100%;height:auto}.myork-code{background:#111827;color:#e5e7eb;padding:14px;white-space:pre-wrap}</style></head><body>' + pages + '</body></html>';
            downloadBlob(new Blob([output], {type:'text/html;charset=utf-8'}), 'presentation.html');
        }

        async function exportSlidesPDF() {
            syncAllSlides();
            if (typeof html2pdf !== 'function') { alert('PDF export library unavailable'); return; }
            const holder = document.createElement('div');
            holder.style.position = 'fixed';
            holder.style.left = '-100000px';
            holder.style.width = '960px';
            slides.forEach((html, index) => {
                const page = document.createElement('section');
                page.style.cssText = 'box-sizing:border-box;width:960px;height:540px;padding:40px;background:white;color:#111;font:24px Arial;overflow:hidden;page-break-after:always;';
                page.innerHTML = html;
                holder.appendChild(page);
            });
            document.body.appendChild(holder);
            try {
                await html2pdf().set({filename:'presentation.pdf',margin:0,html2canvas:{scale:1.5,useCORS:true},jsPDF:{unit:'px',format:[960,540],orientation:'landscape'}}).from(holder).save();
            } finally { holder.remove(); }
        }

        async function exportSlidesImage(type) {
            syncAllSlides();
            if (typeof html2canvas !== 'function') { alert('Image export library unavailable'); return; }
            for (let i=0;i<slides.length;i++) {
                const page = document.createElement('div');
                page.style.cssText = 'position:fixed;left:-100000px;top:0;width:1280px;height:720px;box-sizing:border-box;padding:60px;background:#fff;color:#111;font:28px Arial;overflow:hidden;';
                page.innerHTML = slides[i];
                document.body.appendChild(page);
                try {
                    const canvas = await html2canvas(page,{scale:1,backgroundColor:'#ffffff',useCORS:true});
                    const blob = await new Promise(resolve => canvas.toBlob(resolve,type==='jpeg'?'image/jpeg':'image/png',0.95));
                    if (blob) downloadBlob(blob,'slide-'+(i+1)+'.'+(type==='jpeg'?'jpg':'png'));
                } finally { page.remove(); }
            }
        }

        async function exportSlidesPPTX() {
            syncAllSlides();
            try {
                const pptxgen = (await import('https://esm.sh/pptxgenjs@3.12.0')).default;
                const pptx = new pptxgen();
                pptx.layout = 'LAYOUT_WIDE';
                pptx.author = 'Two Plasma Studios';
                pptx.subject = 'MyorkSlydes presentation';
                pptx.title = 'MyorkSlydes Presentation';
                slides.forEach(html => {
                    const slide = pptx.addSlide();
                    const text = html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|h[1-6]|li|tr)>/gi,'\n').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
                    if (text) slide.addText(text,{x:0.5,y:0.4,w:12.2,h:6.5,fontFace:'Aptos',fontSize:20,breakLine:false,fit:'shrink'});
                    const images = [...html.matchAll(/<img[^>]+src=["'](data:image\/(?:png|jpeg|jpg);base64,[^"']+)["'][^>]*>/gi)];
                    images.forEach((match,index) => {
                        try { slide.addImage({data:match[1],x:0.7,y:4.8+index*0.3,w:3.5,h:1.6,transparency:0}); } catch(error) {}
                    });
                });
                await pptx.writeFile({fileName:'presentation.pptx'});
            } catch (error) {
                console.error(error);
                alert('PPTX export failed. Please check your connection and try again.');
            }
        }
    </script>
